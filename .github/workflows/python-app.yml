# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build Windows Executable / Python application

on:
  push:
    branches: [ "main" ] # 当推送到主分支时自动触发
    workflow_dispatch: # 允许在 Actions 页面手动点击运行

jobs:
  build:
    runs-on: windows-latest # 必须使用 Windows 运行环境

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10" # 建议使用 3.8-3.11 之间的稳定版本
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 自动读取并安装项目依赖（如 Pillow>=10.0.0 等）
        pip install -r requirements.txt
        # 单独安装用于打包的 PyInstaller
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        # --noconfirm: 覆盖现有输出
        # --noconsole: 运行时不显示黑色命令行窗口 (对于 GUI 程序很重要)
        # --name: 生成的 exe 和文件夹名称
        # --icon: 设置程序图标
        pyinstaller --noconfirm --noconsole --name "DDArchiveHelper" --icon="images/sign.png" dd_helper.py
        
    - name: Bundle External Assets
      run: |
        # 源码依赖外部的 assets(字体), images(图片), tools(Java解码器) 文件夹
        # 需要将它们复制到打包好的 dist/DDSaveHelper 目录中
        Copy-Item -Path "images" -Destination "DDArchiveHelper\images" -Recurse -ErrorAction SilentlyContinue
        Copy-Item -Path "assets" -Destination "DDArchiveHelper\assets\fonts" -Recurse -ErrorAction SilentlyContinue
        Copy-Item -Path "tools" -Destination "DDArchiveHelper\tools" -Recurse -ErrorAction SilentlyContinue
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: DDArchiveHelper-Windows-Release
        path: DDArchiveHelper
